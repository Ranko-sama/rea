name: Auto Sync Upstream

permissions:
  contents: write

on:
  schedule:
    # 每天 UTC 00:00 (北京时间早上 08:00) 自动检查并同步
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  sync:
    name: Sync with upstream morluto/rea
    runs-on: ubuntu-latest
    if: github.repository == 'Ranko-sama/rea'

    steps:
      - name: Sync with upstream via GitHub API
        run: |
          echo "Triggering upstream merge via GitHub API..."
          response=$(gh api --method POST "repos/${{ github.repository }}/merge-upstream" \
            -f branch="main")
          echo "$response"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Sync upstream tags
        run: |
          git remote add upstream https://github.com/morluto/rea.git
          git fetch upstream --tags
          git push origin --tags || echo "Tags sync completed or skipped."
